name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          # Only builds of main and tags write the cache; branches and PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Lint and unit tests
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Assemble debug APK
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --stacktrace

      - name: Name APKs
        id: apk
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/retrocam-${version}.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/retrocam-${version}-unsigned.apk"
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/retrocam-${version}-debug.apk"
          fi
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: retrocam-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
          if-no-files-found: ignore

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: retrocam-apk
          path: dist

      - name: Refuse unsigned release
        run: |
          if ls dist/*-unsigned.apk >/dev/null 2>&1; then
            echo "::error::Release APK is unsigned. Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets."
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
